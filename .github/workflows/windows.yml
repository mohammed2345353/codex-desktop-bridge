name: Windows checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [pwsh, powershell]
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        shell: ${{ matrix.shell }}
        run: .\tests\Run-Tests.ps1
