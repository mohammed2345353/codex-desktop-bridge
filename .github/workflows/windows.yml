name: Windows checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  powershell-7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        shell: pwsh
        run: .\tests\Run-Tests.ps1
      - name: Test local workflow planner
        shell: pwsh
        run: .\tests\Test-AIWorkflow.ps1
      - name: Test offline workflow transitions
        shell: pwsh
        run: node .\tests\Test-WorkflowUI.cjs
      - name: Test complete starter journey
        shell: pwsh
        run: .\tests\Test-StartWorkflow.ps1
  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        shell: powershell
        run: .\tests\Run-Tests.ps1
      - name: Test local workflow planner
        shell: powershell
        run: .\tests\Test-AIWorkflow.ps1
      - name: Test complete starter journey
        shell: powershell
        run: .\tests\Test-StartWorkflow.ps1
