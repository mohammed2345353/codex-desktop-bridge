name: Windows checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  powershell-7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        shell: pwsh
        run: .\tests\Run-Tests.ps1
  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        shell: powershell
        run: .\tests\Run-Tests.ps1
